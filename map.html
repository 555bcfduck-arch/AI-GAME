<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>오늘 시민들의 AI 계단</title>
<link rel="stylesheet" href="fonts/jua.css">
<link rel="stylesheet" href="fonts/gowun-dodum.css">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/map.css">
<script src="firebase-config.js"></script>
<script src="js/qrcode.js"></script>
</head>
<body>
<div class="tv-title jua">
  <div class="kicker">미디어페스티벌 · 오늘 시민들의</div>
  <div class="big">AI 계단 <mark>어디까지 올랐나?</mark></div>
</div>
<div class="tv-stage" id="stage"><div class="bubble" id="bubble"></div></div>
<aside class="tv-side">
  <div class="panel-box">
    <div class="jua today">오늘 <span id="total">0</span>명이 올랐어요</div>
    <div class="soft" id="avg">첫 번째 주인공을 기다려요!</div>
  </div>
  <div class="panel-box">
    <div class="jua wall-title">🧱 시민들을 가장 많이 막은 벽</div>
    <div id="walls"></div>
  </div>
  <div class="panel-box join">
    <div id="qr"></div>
    <div class="jua">내 폰으로도<br>올라 보세요!</div>
  </div>
</aside>
<div class="arrive" id="arrive"><div class="arrive-box"><img class="arrive-char" id="arrive-char" alt=""><div class="arrive-txt jua" id="arrive-txt"></div></div></div>
<div class="mode-badge" id="mode"></div>
<script type="module" src="js/map.js"></script>
</body>
</html>
